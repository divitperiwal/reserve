services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reserve
      POSTGRES_USER: reserve
      POSTGRES_PASSWORD: reserve
    ports:
      - "5432:5432"
    volumes:
      - reserve-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserve -d reserve"]
      interval: 5s
      retries: 10

volumes:
  reserve-db:
